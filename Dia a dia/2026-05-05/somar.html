<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button onclick="calcular()">Calcular</button>
    <div id="exibirResultado"></div>
    
</body>

<script>

    function calcular(){
        let resultado = somar(10,12)
        exibirResultado.innerHTML = resultado

    }

    function somar(a,b){
        let soma = a + b

        return soma;
    }
</script>
