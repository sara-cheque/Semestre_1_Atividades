<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button onclick="Adicionar(5)">Adicionar + 5</button>
    <button onclick="Adicionar(100)">Adicionar + 100</button>
    <div id="exibirResultado"></div>
    
</body>
</html>

<script>

    let contador = 0

    function Adicionar(valor){
        console.log(valor)
        contador += valor
        exibirResultado.innerHTML = contador
    }
</script>
